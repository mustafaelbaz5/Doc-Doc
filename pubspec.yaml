name: doc_doc
description: "Doc Doc For Doctor Appointments"

# Prevent accidental publishing to pub.dev for private packages
publish_to: "none"

# Versioning
# Format:
# - Android: versionName (build-name), versionCode (build-number)
# - iOS: CFBundleShortVersionString (build-name), CFBundleVersion (build-number)
# - Windows: major.minor.patch (build-name), build-number as suffix
version: 1.0.1+1

# Dart SDK environment
environment:
  sdk: ^3.9.2

# ----------------------------------------------------------------
# DEPENDENCIES
# ----------------------------------------------------------------
dependencies:
  # Firebase
  firebase_core: ^4.4.0

  # Networking
  dio: ^5.7.0

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  hydrated_bloc: ^10.1.1
  path_provider: ^2.1.5

  # Utilities
  flutter_secure_storage: ^9.2.4
  get_it: ^9.2.0
  easy_localization: ^3.0.8
  flutter_svg: ^2.2.3
  pretty_dio_logger: ^1.4.0
  translator: ^1.0.4+1

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  persistent_bottom_nav_bar: any

  # Flutter SDK
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4

# ----------------------------------------------------------------
# DEV DEPENDENCIES
# ----------------------------------------------------------------
dev_dependencies:
  # Lints & Code Quality
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # ensures compatibility
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

  # Flutter testing framework
  flutter_test:
    sdk: flutter

# ----------------------------------------------------------------
# FLUTTER SETTINGS
# ----------------------------------------------------------------
flutter:
  # Enable Material Design icons and theming
  uses-material-design: true

  # Assets included in the build
  assets:
    - assets/images/
    - assets/svgs/
    - assets/translations/

  # Fonts (example template, uncomment and edit if needed)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/inter/Inter_18pt-Light.ttf
          weight: 300

        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400

        - asset: assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500

        - asset: assets/fonts/inter/Inter_18pt-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700

        - asset: assets/fonts/inter/Inter_18pt-ExtraBold.ttf
          weight: 800

    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-ExtraLight.ttf
          weight: 200
