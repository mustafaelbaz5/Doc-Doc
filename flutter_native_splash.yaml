flutter_native_splash:
  # ======================================================================
  # 🚀 GLOBAL SPLASH SETTINGS (Android <12, iOS, Web)
  # ======================================================================
  color: "#ffffff" 
  image: assets/images/slash_screen_light.png
  
  color_dark: "#212020" 
  image_dark: assets/images/slash_screen_dark.png

  fullscreen: true

  # ======================================================================
  # 🟦 ANDROID 12+ SETTINGS (The "Adaptive" Splash)
  # ======================================================================
  android_12:
    color: "#ffffff"
    # Ensure these are icons (logos), not full-screen backgrounds
    image: assets/images/splash_image_light.png
    
    color_dark: "#212020"
    image_dark: assets/images/splash_image_dark.png

    icon_background_color: "#ffffff"
    icon_background_color_dark: "#212020"

  # Optional: ensures the splash fills the screen on web/desktop
  web: false

  
# 🟦-Commands-
# To run the command to create the splash screen
# dart run flutter_native_splash:create --path=flutter_native_splash.yaml

# To run the command to update the splash screen
# dart run flutter_native_splash:update --path=flutter_native_splash.yaml

# To run the command to delete the splash screen
# dart run flutter_native_splash:delete --path=flutter_native_splash.yaml
